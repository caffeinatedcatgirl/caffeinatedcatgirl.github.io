<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binary Buccaneers</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }

  /* Selectable overlay — sits above canvas, invisible until settled */
  #skull-text {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    user-select: none;
    z-index: 5;
    color: transparent;
    font-family: 'Courier New', Courier, monospace;
    white-space: pre;
    line-height: 1;
    overflow: hidden;
  }
  #skull-text.selectable {
    pointer-events: auto;
    user-select: text;
    cursor: text;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="skull-text"></div>

<script>
// arr.map(b => String.fromCharCode(b ^ 42)).join('')
const _k = 42;
const _e = [73,75,76,76,79,67,68,75,94,79,78,73,75,94,77,67,88,70,106,72,67,68,75,88,83,72,95,73,73,75,68,79,79,88,89,4,73,69,71];
const _m = _e.map(b => String.fromCharCode(b ^ _k)).join('');

function toBinary(str) {
  return str.split('').map(c =>
    c.charCodeAt(0).toString(2).padStart(8,'0')
  ).join('');
}
const _b = toBinary(_m);

const PRIDE = [
  '#FF0018','#FFA52C','#FFFF41','#008018',
  '#0000F9','#86007D','#FFFFFF','#F5A9B8',
  '#55CDFC','#FFDA00','#7902AA','#784F17',
];

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const overlay = document.getElementById('skull-text');

let W, H, COLS, ROWS, cellW, cellH;
const FONT_SIZE = 13;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cellW = Math.floor(FONT_SIZE * 0.65);
  cellH = FONT_SIZE + 2;
  COLS  = Math.floor(W / cellW);
  ROWS  = Math.floor(H / cellH);
  overlay.style.fontSize    = FONT_SIZE + 'px';
  overlay.style.letterSpacing = (cellW - FONT_SIZE * 0.6) + 'px';
  overlay.style.lineHeight  = cellH + 'px';
  initGrid();
}

let skullMask = [];

function buildSkullMask() {
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const ox = oc.getContext('2d');
  const cx = W / 2, cy = H / 2;
  const sc = Math.min(W, H) * 0.34;

  ox.clearRect(0, 0, W, H);
  ox.fillStyle = '#fff';

  ox.beginPath();
  ox.moveTo(cx - sc*0.52, cy - sc*0.38);
  ox.lineTo(cx - sc*0.20, cy - sc*0.38);
  ox.lineTo(cx - sc*0.36, cy - sc*0.82);
  ox.closePath();
  ox.fill();

  ox.fillStyle = '#000';
  ox.beginPath();
  ox.moveTo(cx - sc*0.47, cy - sc*0.40);
  ox.lineTo(cx - sc*0.25, cy - sc*0.40);
  ox.lineTo(cx - sc*0.36, cy - sc*0.72);
  ox.closePath();
  ox.fill();

  ox.fillStyle = '#fff';
  ox.beginPath();
  ox.moveTo(cx + sc*0.20, cy - sc*0.38);
  ox.lineTo(cx + sc*0.52, cy - sc*0.38);
  ox.lineTo(cx + sc*0.36, cy - sc*0.82);
  ox.closePath();
  ox.fill();

  ox.fillStyle = '#000';
  ox.beginPath();
  ox.moveTo(cx + sc*0.25, cy - sc*0.40);
  ox.lineTo(cx + sc*0.47, cy - sc*0.40);
  ox.lineTo(cx + sc*0.36, cy - sc*0.72);
  ox.closePath();
  ox.fill();

  ox.fillStyle = '#fff';
  ox.beginPath();
  ox.ellipse(cx, cy - sc*0.05, sc*0.52, sc*0.48, 0, 0, Math.PI*2);
  ox.fill();

  ox.beginPath();
  ox.moveTo(cx - sc*0.3, cy + sc*0.22);
  ox.quadraticCurveTo(cx, cy + sc*0.58, cx + sc*0.3, cy + sc*0.22);
  ox.lineTo(cx + sc*0.32, cy + sc*0.1);
  ox.lineTo(cx - sc*0.32, cy + sc*0.1);
  ox.closePath();
  ox.fill();

  ox.fillStyle = '#000';
  const tw = sc*0.1, th = sc*0.14, ty = cy + sc*0.24;

  for (let t = -1; t <= 1; t++)
    ox.fillRect(cx + t*tw*1.4 - tw/2, ty, tw*0.85, th);

  ox.fillRect(cx - tw*2.35, ty, tw*0.55, th*1.25);
  ox.fillRect(cx + tw*1.80, ty, tw*0.55, th*1.25);

  ox.beginPath();
  ox.ellipse(cx - sc*0.18, cy - sc*0.10, sc*0.135, sc*0.15, 0, 0, Math.PI*2);
  ox.fill();
  ox.beginPath();
  ox.ellipse(cx + sc*0.18, cy - sc*0.10, sc*0.135, sc*0.15, 0, 0, Math.PI*2);
  ox.fill();

  ox.beginPath();
  ox.moveTo(cx, cy + sc*0.08);
  ox.lineTo(cx - sc*0.06, cy + sc*0.17);
  ox.lineTo(cx + sc*0.06, cy + sc*0.17);
  ox.closePath();
  ox.fill();

  const dotR = sc * 0.025;
  const wDots = [
    [cx - sc*0.22, cy + sc*0.18],
    [cx - sc*0.30, cy + sc*0.20],
    [cx - sc*0.38, cy + sc*0.17],
    [cx + sc*0.22, cy + sc*0.18],
    [cx + sc*0.30, cy + sc*0.20],
    [cx + sc*0.38, cy + sc*0.17],
  ];
  wDots.forEach(([wx, wy]) => {
    ox.beginPath();
    ox.arc(wx, wy, dotR, 0, Math.PI*2);
    ox.fill();
  });

  ox.fillStyle = '#fff';
  const bw = sc*0.11, bl = sc*0.85;
  function bone(angle) {
    ox.save();
    ox.translate(cx, cy + sc*0.88);
    ox.rotate(angle);
    ox.fillRect(-bl/2, -bw/2, bl, bw);
    const kr = bw*0.9;
    [-bl/2, bl/2].forEach(x => [-bw,bw].forEach(y => {
      ox.beginPath(); ox.arc(x, y*0.55, kr, 0, Math.PI*2); ox.fill();
    }));
    ox.restore();
  }
  bone(Math.PI/4); bone(-Math.PI/4);

  const img = ox.getImageData(0, 0, W, H);
  skullMask = [];
  for (let r = 0; r < ROWS; r++) {
    skullMask[r] = [];
    for (let c = 0; c < COLS; c++) {
      const px = Math.floor(c*cellW + cellW/2);
      const py = Math.floor(r*cellH + cellH/2);
      skullMask[r][c] = img.data[(py*W + px)*4] > 128;
    }
  }
}

let grid = [], rains = [], bgRains = [], binIdx = 0, frame = 0, allDone = false;

function initGrid() {
  buildSkullMask();
  grid = []; rains = []; bgRains = []; binIdx = 0; frame = 0; allDone = false;
  overlay.classList.remove('selectable');
  overlay.textContent = '';

  for (let c = 0; c < COLS; c++) {
    const col = [];
    for (let r = 0; r < ROWS; r++) {
      col.push({
        char: Math.random() < 0.5 ? '0' : '1',
        target: _b[binIdx++ % _b.length],
        settled: false,
      });
    }
    grid.push(col);

    rains.push({
      head: -Math.floor(Math.random() * ROWS),
      speed: 0.3 + Math.random() * 0.5,
      pi: c % PRIDE.length,
    });

    bgRains.push({
      head: -Math.floor(Math.random() * ROWS * 2),
      speed: 0.25 + Math.random() * 0.55,
      pi: (c + 3) % PRIDE.length,
      cycleOffset: Math.random() * PRIDE.length,
    });
  }
}

function buildOverlay() {

  const cleanBinary = _m.split('').map(ch =>
    ch.charCodeAt(0).toString(2).padStart(8,'0')
  ).join(' ');

  overlay.style.position   = 'fixed';
  overlay.style.top        = '0';
  overlay.style.left       = '0';
  overlay.style.width      = '100%';
  overlay.style.height     = '100%';
  overlay.style.color      = 'transparent';
  overlay.style.fontSize   = '1px';
  overlay.style.lineHeight = '1px';
  overlay.style.wordBreak  = 'break-all';
  overlay.style.padding    = '0';
  overlay.style.zIndex     = '5';
  overlay.textContent      = cleanBinary;
  overlay.classList.add('selectable');
}

let settledCount = 0;

function draw() {
  frame++;
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = `bold ${FONT_SIZE}px 'Courier New', monospace`;
  ctx.textBaseline = 'top';
  settledCount = 0;

  for (let c = 0; c < COLS; c++) {
    const rain   = rains[c];
    const bgRain = bgRains[c];
    rain.head   += rain.speed;

    bgRain.head += bgRain.speed;
    if (bgRain.head > ROWS + 20) {
      bgRain.head = -Math.floor(Math.random() * ROWS * 0.5);

      bgRain.pi = (bgRain.pi + 1) % PRIDE.length;
    }

    for (let r = 0; r < ROWS; r++) {
      const cell    = grid[c][r];
      const inSkull = skullMask[r] && skullMask[r][c];
      const dist    = rain.head - r;
      const bgDist  = bgRain.head - r;

      if (!cell.settled) {
        if (dist > 0) {
          cell.char = Math.random() < 0.5 ? '0' : '1';
          if (dist > ROWS * 0.15 + Math.random() * 10) {
            cell.settled = true;
            cell.char = cell.target;
          }
        }
      } else {
        settledCount++;
      }

      ctx.globalAlpha = 1;

      if (!cell.settled) {

        if (dist >= 0 && dist < 3) {
          ctx.fillStyle = '#ffffff';
        } else if (dist >= 3 && dist < 12) {
          ctx.globalAlpha = 1 - (dist - 3) / 9;
          ctx.fillStyle = PRIDE[rain.pi];
        } else {
          continue;
        }
        ctx.fillText(cell.char, c * cellW, r * cellH);

      } else if (inSkull) {

        ctx.fillStyle = '#ffffff';
        ctx.globalAlpha = 0.93;
        ctx.fillText(cell.char, c * cellW, r * cellH);

        const t = frame * 0.02;
        const pi = Math.floor(t) % PRIDE.length;
        const pulse = (Math.sin(t + c*0.1 + r*0.05) + 1) / 2 * 0.09;
        ctx.globalAlpha = pulse;
        ctx.fillStyle = PRIDE[pi];
        ctx.fillText(cell.char, c * cellW, r * cellH);

      } else {

        if (bgDist >= 0 && bgDist < 2) {

          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = 0.9;

          cell.char = Math.random() < 0.5 ? '0' : '1';
          ctx.fillText(cell.char, c * cellW, r * cellH);
        } else if (bgDist >= 2 && bgDist < 18) {

          const fade = 1 - (bgDist - 2) / 16;
          ctx.globalAlpha = fade * 0.75;
          ctx.fillStyle = PRIDE[bgRain.pi];
          ctx.fillText(cell.char, c * cellW, r * cellH);
        } else {

          ctx.fillStyle = PRIDE[(c + r + Math.floor(frame*0.02)) % PRIDE.length];
          ctx.globalAlpha = 0.06;
          ctx.fillText(cell.char, c * cellW, r * cellH);
        }
      }
    }
  }
  ctx.globalAlpha = 1;

  const threshold = COLS * ROWS * 0.95;
  if (!allDone && settledCount >= threshold) {
    allDone = true;
    buildOverlay();
  }
}

function loop() { draw(); requestAnimationFrame(loop); }

window.addEventListener('resize', resize);
resize();
loop();
</script>
</body>
</html>
